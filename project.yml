name: DumpCompare
options:
  bundleIdPrefix: dev.maxik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DumpCompareCore:
    path: DumpCompareCore

targets:
  DumpCompare:
    type: application
    platform: macOS
    sources:
      - path: DumpCompareApp
    dependencies:
      - package: DumpCompareCore
    entitlements:
      path: DumpCompareApp/DumpCompare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxik.DumpCompare
        PRODUCT_NAME: DumpCompare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DumpCompare
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Local development signing (no Apple Developer team needed).
        # Switch to Automatic + a team before distribution.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
