name: DumpCompare
options:
  bundleIdPrefix: dev.maxik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  DumpCompareCore:
    path: DumpCompareCore
  ALSplitView:
    path: ALSplitView

targets:
  DumpCompare:
    type: application
    platform: macOS
    sources:
      - path: DumpCompareApp
    dependencies:
      - package: DumpCompareCore
      - package: ALSplitView
    entitlements:
      path: DumpCompareApp/DumpCompare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    # The Info.plist is a source file (generated by XcodeGen from this block) so
    # the app can declare CFBundleDocumentTypes (.bin/.rom) for "Open with" — a
    # complex nested key that scalar INFOPLIST_KEY_* settings can't express.
    info:
      path: DumpCompareApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: DumpCompare
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Binary File
            CFBundleTypeRole: Viewer
            # .bin/.rom have no stable standard UTI, and claiming public.data
            # would offer to open every data file; the extension list scopes the
            # association to exactly these two.
            CFBundleTypeExtensions: [bin, rom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxik.DumpCompare
        PRODUCT_NAME: DumpCompare
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "4"
        # The icon lives in Assets.xcassets; Design/render-appicon.sh regenerates
        # its images from Design/AppIcon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Local development signing (no Apple Developer team needed).
        # Switch to Automatic + a team before distribution.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

  DumpCompareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DumpCompareTests
    dependencies:
      - target: DumpCompare
      - package: DumpCompareCore
      - package: ALSplitView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxik.DumpCompareTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Match the app's local ad-hoc signing so the test bundle is actually
        # signed; the host app's codesign validates its embedded xctest plugin
        # and fails ("code object is not signed at all") if it is not.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  DumpCompare:
    build:
      targets:
        DumpCompare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DumpCompareTests
    profile:
      config: Release
    analyze:
      config: Debug

