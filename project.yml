name: DumpCompare
options:
  bundleIdPrefix: dev.maxik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Every local package goes into one navigator group, wherever it lives on
  # disk. Left at its default the group is called "Packages" AND carries
  # `path = Packages`, so the tool-modules — which live in `Modules/` — show up
  # in it wearing the badge Xcode puts on an item whose real folder is
  # elsewhere, and the list reads as two sorts of package. Named like this the
  # group is emitted with a name and no path (measured), so all of them are
  # listed the same way.
  localPackagesGroup: "Local Packages"

# Files the project references without them belonging to a target's sources.
# Without this the signing config is a reference Xcode cannot place, and it
# shows up under "Recovered References" — which looks exactly like junk left
# over from a crash, and was deleted as such once.
fileGroups:
  - Signing.xcconfig

# Every package is local; there are no remote dependencies. `Packages/` holds the
# shared libraries and `Modules/` the tool-modules, one directory per package —
# the two shapes are described in `CLAUDE.md`. Every one of them is listed here,
# including those only a tool-module links: SwiftPM would resolve those through
# that module's own manifest and build them either way, but a package Xcode
# cannot see is one nobody edits in the project they have open.
packages:
  DumpCompareCore:
    path: Packages/DumpCompareCore
  ALSplitView:
    path: Packages/ALSplitView
  ToolModuleKit:
    path: Packages/ToolModuleKit
  # The shared parser. The tool-modules depend on it transitively, but the app's
  # flow tests build a UEFI image by hand and so import it directly.
  UEFIImage:
    path: Packages/UEFIImage
  # The ME/engine analysis engine. MEATool consumes it; the app's flow tests
  # install a stub `MEADataSource` and so import it directly.
  MEFirmware:
    path: Packages/MEFirmware
  # The introduction between the seam's reader and the parser's `ByteSource`,
  # which both firmware tool-modules link and no target here depends on.
  UEFIContentSource:
    path: Packages/UEFIContentSource
  ZoneSketch:
    path: Modules/ZoneSketch
  FITTool:
    path: Modules/FITTool
  UEFITool:
    path: Modules/UEFITool
  MEATool:
    path: Modules/MEATool

targets:
  DumpCompare:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: DumpCompareApp
    dependencies:
      - package: DumpCompareCore
      - package: ALSplitView
      # What a tool-module and the app agree on (Design/TOOL_MODULES_PLAN.md).
      # The app links it; each tool-module package links it too, and that is the
      # whole of what the two sides share.
      - package: ToolModuleKit
      # The shared, per-pane lazy UEFI tree (`PaneUEFIState`) and its
      # `ByteSource` adapter over the document's live storage
      # (`PaneToolHost`'s `UEFITreeProviding` conformance) — both live in the
      # app, which is why it links this directly rather than only through a
      # tool-module's transitive graph.
      - package: UEFIImage
      # `PaneUEFIState`'s cache of the last `FirmwareAnalysis`
      # (`MEAAnalysisProviding`) is a value the app stores, not just passes
      # through, so it needs the type directly.
      - package: MEFirmware
        product: MEFirmware
      # One line per tool-module the app ships. The registry lists them; this is
      # what puts them in the binary.
      - package: ZoneSketch
        product: ZoneSketchUI
      - package: FITTool
        product: FITToolUI
      - package: UEFITool
        product: UEFIToolUI
      - package: MEATool
        product: MEAToolUI
    entitlements:
      path: DumpCompareApp/DumpCompare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Outgoing HTTPS, for two reads: the FIT tool-module's microcode
        # catalogue at github.com/platomav/CPUMicrocodes, and the ME Analyzer's
        # fresh firmware database at github.com/platomav/MEAnalyzer. Nothing else
        # in the app talks to a network, and nothing about a user's file leaves
        # it.
        com.apple.security.network.client: true
    # The Info.plist is a source file (generated by XcodeGen from this block) so
    # the app can declare CFBundleDocumentTypes (.bin/.rom) for "Open with" — a
    # complex nested key that scalar INFOPLIST_KEY_* settings can't express.
    info:
      path: DumpCompareApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: DumpCompare
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026"
        CFBundleDocumentTypes:
          # The dump extensions the app is about (§25.2). The icon is generated
          # by the system from the app icon, so a dump on the desktop is
          # recognisable as ours — and an icon comes from DECLARING a type, not
          # from being its default handler (measured), which is why the named
          # extensions are listed here at all.
          # One entry per extension: the system generates a document icon per
          # declared TYPE, and a second extension listed in the same entry does
          # not get one (measured).
          - CFBundleTypeName: ROM Dump
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions: [rom]
            CFBundleTypeIconSystemGenerated: true
            # Owner: nothing else claims these, and the app is what opens them.
            LSHandlerRank: Owner
          - CFBundleTypeName: Binary Dump
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions: [dump]
            CFBundleTypeIconSystemGenerated: true
            LSHandlerRank: Owner
          # .bin resolves to com.apple.macbinary-archive, a system type owned by
          # Archive Utility, so the honest rank is Alternate: the default moves
          # here only when the user asks in Settings > File Types (§25.3).
          - CFBundleTypeName: Binary File
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions: [bin]
            CFBundleTypeIconSystemGenerated: true
            LSHandlerRank: Alternate
          # Any file at all (§25.2). A hex editor can open every byte sequence
          # there is — and this is what makes a user-added extension work:
          # Launch Services binds a default only to an app that is a legal
          # handler for the type, and an unheard-of extension resolves to a
          # dynamic type conforming to public.data. Alternate, so declaring it
          # never makes the app anyone's default by itself; only the user's own
          # choice does (measured: an undeclared extension still has no handler).
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.data]
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxik.DumpCompare
        PRODUCT_NAME: DumpCompare
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "11"
        # The icon lives in Assets.xcassets; Design/render-appicon.sh regenerates
        # its images from Design/AppIcon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Signing comes from `Signing.xcconfig`, which reads the team from a
        # local file git does not track: an account's team is personal, and the
        # repository has no business knowing whose machine built the app.
        # Without that file the build falls back to ad-hoc signing — it runs,
        # but a folder the user grants stops surviving rebuilds (§11).

  DumpCompareTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: DumpCompareTests
    # Every product the suite imports, declared here rather than borrowed from
    # the host app's own links: a test that compiles only because the app
    # happens to link something is a test that breaks when the app stops.
    dependencies:
      - target: DumpCompare
      - package: DumpCompareCore
      - package: ALSplitView
      - package: ToolModuleKit
      - package: UEFIImage
      - package: ZoneSketch
        product: ZoneSketchUI
      - package: FITTool
        product: FITTool
      - package: FITTool
        product: FITToolUI
      - package: UEFITool
        product: UEFIToolUI
      - package: MEFirmware
        product: MEFirmware
      - package: MEATool
        product: MEAToolUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxik.DumpCompareTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Signed the same way as the host, from the same file: the host app's
        # codesign validates its embedded xctest plugin and fails ("code object
        # is not signed at all") if the bundle is signed differently.

schemes:
  DumpCompare:
    build:
      targets:
        DumpCompare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DumpCompareTests
    profile:
      config: Release
    analyze:
      config: Debug

